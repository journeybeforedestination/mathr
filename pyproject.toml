[project]
name = "mathr"
version = "0.1.0"
description = "A math-fact rocket builder for one second grader"
readme = "README.md"
authors = [
    { name = "Jared Campbell", email = "jaredc@hey.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
mathr = "mathr:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
